<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06152b" />
    <title>Zakeem Solutions — Technology • Intelligence • Delivery</title>
    <meta
      name="description"
      content="Zakeem Solutions is a premier technology and digital transformation company delivering software engineering, AI-powered systems, enterprise solutions, and digital infrastructure."
    />
    <!-- Fonts: Retaining JetBrains Mono for telemetry/code while sans uses native Apple system font stack -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Anti-FOUC Theme & Font Scale Script -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("zakeem-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);

          var storedFontSize = localStorage.getItem("zakeem-font-size");
          if (storedFontSize) {
            var size = parseInt(storedFontSize, 10);
            if (!isNaN(size) && size >= 85 && size <= 125) {
              document.documentElement.style.fontSize = size + "%";
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-[#e57804] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
