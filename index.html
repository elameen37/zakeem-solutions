    <!-- Anti-FOUC Theme & Font Scale Script -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("zakeem-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "light";
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);

          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute("content", theme === "dark" ? "#06152b" : "#f8fafc");
          }

          var storedFontSize = localStorage.getItem("zakeem-font-size");
          if (storedFontSize) {
            var size = parseInt(storedFontSize, 10);
            if (!isNaN(size) && size >= 85 && size <= 125) {
              document.documentElement.style.fontSize = size + "%";
            } else {
              document.documentElement.style.fontSize = "85%";
            }
          } else {
            document.documentElement.style.fontSize = "85%";
          }
        } catch (e) {}
      })();
    </script>
