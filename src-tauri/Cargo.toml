[package]
name = "zakeem-solutions"
version = "1.0.0"
description = "Enterprise software engineering, AI automation, Zakeem Realty ERP, and mission-critical digital infrastructure."
authors = ["Zakeem Solutions <info@zakeemsolutions.com>"]
edition = "2021"
default-run = "zakeem-solutions"

[lib]
name = "zakeem_solutions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
